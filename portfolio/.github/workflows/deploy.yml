name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST daily, picks up projects.json and pub.dev changes
  repository_dispatch:
    types: [projects-updated]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm ci && npm test
        working-directory: functions
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LKRJANGID_PORTFOLIO }}
          projectId: lkrjangid-portfolio
          # Pull requests get a preview channel; everything else goes live.
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
