# ============================================================
# Keeps pub_packages.json in sync with your pub.dev publisher.
# Runs daily + on demand. Calls the pub.dev SEARCH API here
# (server-side) because that endpoint sends no CORS headers and
# cannot be called from the browser. The portfolio widget reads
# the committed pub_packages.json, then hydrates each package
# live in the browser from /api/packages/<name> (which has CORS).
#
# Install: commit this file to the lkrjangid1/lkrjangid1 repo at
#   .github/workflows/update-pub-packages.yml
# Then run it once manually: Actions tab -> this workflow ->
#   "Run workflow" -> confirms everything works.
# ============================================================

name: Update pub.dev packages list

on:
  schedule:
    - cron: "30 2 * * *"   # daily at 02:30 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch package names from pub.dev (with pagination)
        run: |
          python3 - << 'PY'
          import json, urllib.request

          names = []
          url = "https://pub.dev/api/search?q=publisher:lkrjangid.tech"
          pages = 0
          while url and pages < 10:
              req = urllib.request.Request(
                  url, headers={"User-Agent": "portfolio-sync/1.0"})
              data = json.load(urllib.request.urlopen(req, timeout=30))
              names += [p["package"] for p in data.get("packages", [])]
              url = data.get("next")
              pages += 1

          if not names:
              raise SystemExit("pub.dev returned no packages; aborting without changes")

          with open("pub_packages.json", "w") as f:
              json.dump({"names": names}, f, indent=2)
          print(f"Wrote {len(names)} package names")
          PY

      - name: Commit if changed
        run: |
          if ! git diff --quiet pub_packages.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pub_packages.json
            git commit -m "chore: sync pub.dev package list"
            git push
          else
            echo "No changes."
          fi
